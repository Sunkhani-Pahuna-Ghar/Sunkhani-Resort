services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      - frontend
      - backend

  frontend:
    platform: linux/amd64
    image: 781863099404.dkr.ecr.ap-southeast-2.amazonaws.com/frontend:latest
    environment:
      NEXT_PUBLIC_BACKEND_URL: https://auditor.fundevops.com
    expose:
      - "3000"

  backend:
    image: 781863099404.dkr.ecr.ap-southeast-2.amazonaws.com/backend:latest
    expose:
      - "3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/cs-auditor
      JWT_SECRET: your_jwt_secret_here
      JWT_EXPIRATION: 24h
      NODE_ENV: production
      PORT: 3000
      STORAGE_BUCKET: cs-auditor
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USER: sud.dreambig@gmail.com
      MAIL_PASS: qjmr vkue uzsz lmdf
      MAIL_FROM: "CS Auditor <sud.dreambig@gmail.com>"
      FRONTEND_URL: https://auditor.fundevops.com/auth/reset-password
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin        # acts like AWS_ACCESS_KEY_ID
      MINIO_ROOT_PASSWORD: miniosecret   # acts like AWS_SECRET_ACCESS_KEY
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  mongo_data:
  minio-data:
networks:
  cs-auditor: